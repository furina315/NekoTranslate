name: Android APKs (debug + release)

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # default installs the obsolete 'tools' package, which no longer exists
          packages: 'platform-tools'

      - name: Install SDK platform, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --version
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon :llama:testDebugUnitTest :app:testDebugUnitTest

      # Release = R8-minified + baseline profiles (much smoother Compose UI). It is signed with the
      # debug keystore Gradle generates on the runner, so it installs directly but is NOT a
      # publishable build. Native code is -O3 (CMAKE_BUILD_TYPE=Release) in both variants.
      - name: Build debug + release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Upload release APK (install this one)
        uses: actions/upload-artifact@v4
        with:
          name: NekoTranslate-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NekoTranslate-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NekoTranslate-release-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore

      - name: List native libraries in APK
        if: always()
        run: |
          for apk in app/build/outputs/apk/*/*.apk; do
            echo "== $apk ($(du -h "$apk" | cut -f1))"
            unzip -l "$apk" | grep -E '\.so$|baseline\.prof' || true
          done
