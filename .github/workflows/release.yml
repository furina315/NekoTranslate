name: Release APKs

# Full native + R8 release build: three APKs (armeabi-v7a, arm64-v8a, universal) plus the R8
# mapping, published as plain files on a GitHub Release.
#
#   git tag -a v0.2.0 -m "更新说明" && git push origin v0.2.0
#                                                        -> Release "v0.2.0"; the annotated tag's message
#                                                           goes at the top of the notes, followed by
#                                                           GitHub's auto-generated commit/PR list.
#   versionName = tag without "v"; versionCode = X*10000 + Y*100 + Z from vX.Y.Z (nothing to bump).
#   git tag v0.2.0-beta1 && git push origin v0.2.0-beta1  -> same, marked pre-release (tag has '-')
#   Actions -> "Release APKs" -> Run workflow (branch main) -> pre-release "nightly", deleted and
#     re-created on every manual run so it always points at the commit just built. Choosing a v*
#     tag in "Use workflow from" instead rebuilds that tag and replaces its release files.
#
# Note: GitHub skips tag pushes too when the tagged commit's message contains a skip-ci marker,
# so do not tag such a commit (or use the manual run instead).
#
# Signing: repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS,
# RELEASE_KEY_PASSWORD. Tag builds fail without them (a debug-signed release could never be updated);
# a manual nightly falls back to the runner's throwaway debug key with a warning.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NDK_VERSION: "29.0.14206865"
  CMAKE_VERSION: "3.31.6"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Work out release name
        id: meta
        run: |
          short=$(git rev-parse --short HEAD)
          git fetch --force --tags origin > /dev/null 2>&1 || true
          # vX.Y.Z[-anything] -> X*10000 + Y*100 + Z
          code_of() {
            echo "$1" | sed -nE 's/^v?([0-9]+)\.([0-9]+)\.([0-9]+).*/\1 \2 \3/p' \
              | awk '{ print $1*10000 + $2*100 + $3 }'
          }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            case "$tag" in *-*) prerelease=true ;; *) prerelease=false ;; esac
            code=$(code_of "$tag")
            [ -n "$code" ] || { echo "::error::tag $tag is not vX.Y.Z[-suffix]"; exit 1; }
            # Annotated tag message -> top of the release notes (lightweight tags have none).
            if [ "$(git cat-file -t "refs/tags/$tag")" = "tag" ]; then
              git tag -l --format='%(contents)' "$tag" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > tag_message.md
            fi
          else
            tag="nightly"
            base=$(sed -nE 's/.*versionName = .*\?: "([0-9][^"]*)".*/\1/p' app/build.gradle.kts | head -1)
            version="${base:-0.0.0}-nightly-${short}"
            prerelease=true
            # Latest v* tag + 1, so a nightly installs over the last release.
            last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
            code=$(( $(code_of "${last:-v$base}") + 1 ))
          fi
          touch tag_message.md
          {
            echo "code=$code"
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "short=$short"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag, version $version, prerelease=$prerelease"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK platform, NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (JVM)
        run: ./gradlew --no-daemon -Plt.skipNative=true :llama:testDebugUnitTest :app:testDebugUnitTest

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "LT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore decoded."
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release."
            exit 1
          else
            echo "::warning::No release keystore secret; nightly is signed with a throwaway debug key."
          fi

      # Release = R8-minified + baseline profiles. Native code is -O3 in every variant.
      - name: Build release APKs (armeabi-v7a, arm64-v8a, universal)
        env:
          LT_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          LT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          LT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon "-Plt.versionName=${{ steps.meta.outputs.version }}" "-Plt.versionCode=${{ steps.meta.outputs.code }}" :app:assembleRelease

      - name: Collect and check release files
        run: |
          set -eu
          v="${{ steps.meta.outputs.version }}"
          out=app/build/outputs/apk/release
          cat "$out/output-metadata.json"
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a universal; do
            cp "$(ls "$out"/*-"$abi"-release.apk)" "dist/NekoTranslate-$v-$abi.apk"
            unzip -l "dist/NekoTranslate-$v-$abi.apk" > "list-$abi.txt"
            echo "== NekoTranslate-$v-$abi.apk ($(du -h "dist/NekoTranslate-$v-$abi.apk" | cut -f1))"
            grep -E '\.so$' "list-$abi.txt" || true
          done
          cp app/build/outputs/mapping/release/mapping.txt "dist/NekoTranslate-$v-mapping.txt"
          # Each split carries only its own ABI; the universal APK carries both.
          has() { grep -q "lib/$2/libllama.so" "list-$1.txt"; }
          fail() { echo "::error::$1"; exit 1; }
          has armeabi-v7a armeabi-v7a || fail "v7a APK lacks armeabi-v7a libs"
          has armeabi-v7a arm64-v8a   && fail "v7a APK contains arm64-v8a libs"
          has arm64-v8a   arm64-v8a   || fail "v8a APK lacks arm64-v8a libs"
          has arm64-v8a   armeabi-v7a && fail "v8a APK contains armeabi-v7a libs"
          has universal   armeabi-v7a || fail "universal APK lacks armeabi-v7a libs"
          has universal   arm64-v8a   || fail "universal APK lacks arm64-v8a libs"
          ls -la dist

      - name: Write release notes
        run: |
          v="${{ steps.meta.outputs.version }}"
          llama=$(sed -nE 's/.*LLAMA_CPP_VERSION", "\\"([^\\]*)\\"".*/\1/p' app/build.gradle.kts | head -1)
          {
            if [ -s tag_message.md ]; then
              cat tag_message.md
              echo
              echo "---"
              echo
            fi
            echo "**NekoTranslate $v**（versionCode ${{ steps.meta.outputs.code }}，commit ${{ steps.meta.outputs.short }}，llama.cpp ${llama:-?}）"
            echo
            echo "| 文件 | 适用设备 |"
            echo "|---|---|"
            echo "| \`NekoTranslate-$v-arm64-v8a.apk\` | **推荐**：64位版本，近几年的设备基本都是 |"
            echo "| \`NekoTranslate-$v-armeabi-v7a.apk\` | 只支持32位的老设备，建议只用≤2B的Q4模型 |"
            echo "| \`NekoTranslate-$v-universal.apk\` | 通用版本，体积更大 |"
            echo "| \`NekoTranslate-$v-mapping.txt\` | R8 mapping，用于还原崩溃堆栈，普通用户无需下载 |"
            echo
          } > notes.md
          if [ "${{ steps.meta.outputs.tag }}" = "nightly" ]; then
            printf '\n手动触发的测试构建，每次手动运行都会被覆盖。\n' >> notes.md
          fi
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ steps.meta.outputs.tag }}"
          pre=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then pre="--prerelease"; fi
          if [ "$tag" = "nightly" ]; then
            # Re-create so the nightly tag moves to the commit that was just built.
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly dist/* --target "$GITHUB_SHA" $pre \
              --title "Nightly (${{ steps.meta.outputs.short }})" --notes-file notes.md
          elif gh release view "$tag" > /dev/null 2>&1; then
            # Re-run for an existing tag: replace the files, keep the release.
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag $pre \
              --title "NekoTranslate $tag" --notes-file notes.md --generate-notes
          fi
