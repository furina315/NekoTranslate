org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- LocalTranslate native build switches ---
# true  (default): build every Android arm64 CPU variant of ggml (armv8.0 ... armv9.2+SME) as
#                  separate libggml-cpu-*.so and pick the best one at runtime (llama.cpp's
#                  examples/llama.android pattern).
# false: build a single CPU backend for a fixed -march (see lt.cpuArch). Smaller APK, faster build.
lt.cpuAllVariants=true
# Only used when lt.cpuAllVariants=false. Snapdragon 8 Elite Gen 5 supports dotprod + i8mm + fp16.
lt.cpuArch=armv8.6-a+dotprod+i8mm+fp16
# KleidiAI micro-kernels (Arm). Downloaded by CMake FetchContent at configure time.
lt.kleidiai=true
